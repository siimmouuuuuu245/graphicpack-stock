<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1050" width="100%" height="100%">
  <defs>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.18" />
    </filter>
    <filter id="groundShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="28" />
    </filter>
  </defs>

  <!-- Ground reflection / shadow -->
  <ellipse cx="500" cy="980" rx="280" ry="32" fill="#000000" opacity="0.16" filter="url(#groundShadow)" />

  <!-- Main Graphic Pack Symbol Container -->
  <g filter="url(#softShadow)">
    <!-- Red Outer Rounded Shield / Square -->
    <rect x="155" y="30" width="690" height="690" rx="140" fill="#E30613" />

    <!-- White Inner Fold / P-G Form -->
    <!-- Top-left to bottom-right white shape -->
    <path d="M 320 170 
             L 680 170 
             A 24 24 0 0 1 704 194 
             L 704 290 
             L 596 290 
             L 704 330 
             L 704 550 
             A 28 28 0 0 1 676 578 
             L 414 578 
             L 414 720 
             L 298 720 
             L 298 194 
             A 24 24 0 0 1 320 170 Z" 
          fill="#FFFFFF" />

    <!-- Inner Gray Rounded Square -->
    <rect x="414" y="290" width="172" height="172" rx="36" fill="#8A8D8F" />
  </g>

  <!-- Typography: Graphic Pack -->
  <g id="brandTypography">
    <!-- "Graphic" in Gray -->
    <text x="155" y="815" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="94" font-weight="600" letter-spacing="-1.5" fill="#6A6D70">Graphic</text>
    
    <!-- "Pack" in Red -->
    <text x="588" y="815" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="94" font-weight="800" letter-spacing="-1.5" fill="#E30613">Pack</text>
    
    <!-- Registered Symbol ® in Red -->
    <text x="825" y="750" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="28" font-weight="bold" fill="#E30613">®</text>

    <!-- Subtitle Pill: "le confort de votre emballage" -->
    <rect x="350" y="828" width="495" height="46" rx="6" fill="#787B7E" />
    <text x="597" y="860" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="24.5" font-weight="500" letter-spacing="0.5" fill="#FFFFFF" text-anchor="middle">le confort de votre emballage</text>
  </g>
</svg>
